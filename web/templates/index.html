<!DOCTYPE html>
<html lang="ru">
<head>
    <title>Файловый сервер</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container py-4">
    <!-- Секция ошибок -->
    <div id="errorSection" class="error-container alert alert-danger alert-dismissible fade show" role="alert">
        <span id="errorMessage"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Секция входа -->
    <div id="loginSection" class="login-container">
        <div class="row justify-content-center w-100">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Вход в систему</h5>
                    </div>
                    <div class="card-body">
                        <form id="loginForm" class="mb-3">
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Пароль</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Войти</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Основная секция -->
    <div id="mainSection" style="display: none;">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Файловый сервер</h1>
            <button id="logoutBtn" class="btn btn-outline-danger">Выйти</button>
        </div>

        <div class="current-path mb-3">
            <i class="bi bi-folder2-open me-2"></i>
            <span id="currentPath">Корневая директория</span>
        </div>

        <div class="row mb-4">
            <div class="col-12">
                <div class="card h-100">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Загрузка файла</h5>
                    </div>
                    <div class="card-body">
                        <form id="uploadForm" class="mb-3">
                            <input type="hidden" id="uploadPath" name="path" value=".">
                            <div class="mb-3">
                                <label for="file" class="form-label">Выберите файл для загрузки</label>
                                <input type="file" class="form-control" id="file" name="file" required>
                                <div class="form-text">Максимальный размер файла: 32MB</div>
                            </div>
                            <div class="progress mb-3 d-none">
                                <div class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                            <button type="submit" class="btn btn-primary">Загрузить</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Список файлов и директорий</h5>
                <button class="btn btn-success btn-sm" id="createDirBtn">
                    <i class="bi bi-folder-plus me-1"></i>
                    Создать директорию
                </button>
            </div>
            <div class="card-body">
                <div id="files">
                    <div class="text-center">
                        <div class="spinner-border" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Контекстное меню -->
<div id="contextMenu" class="context-menu">
    <div class="context-menu-item folder" data-action="create">
        <i class="bi bi-folder-plus"></i>
        Создать директорию
    </div>
    <div class="context-menu-item dangerous" data-action="delete">
        <i class="bi bi-trash"></i>
        Удалить
    </div>
</div>

<!-- Модальное окно подтверждения удаления -->
<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Подтверждение удаления</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Вы действительно хотите удалить <span id="itemType">директорию</span> "<span id="itemToDelete"></span>"?</p>
                <p class="text-danger">Это действие нельзя отменить!</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" id="confirmDelete">Удалить</button>
            </div>
        </div>
    </div>
</div>

<!-- Модальное окно создания директории -->
<div class="modal fade" id="createDirModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Создание директории</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createDirForm">
                    <input type="hidden" id="createDirPath" name="path" value=".">
                    <div class="mb-3">
                        <label for="dirname" class="form-label">Имя директории</label>
                        <input type="text" class="form-control" id="dirname" name="dirname" required>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="submit" form="createDirForm" class="btn btn-primary">Создать</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
